name: Optional backend checks

on:
  push:
    branches:
      - master
      - modernize
      - modernize-followup
  pull_request:

permissions:
  contents: read

jobs:
  imports:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: HTTP/2 Python 3.12
            python-version: "3.12"
            extra: h2
            module: h2
          - name: HTTP/2 Python 3.13
            python-version: "3.13"
            extra: h2
            module: h2
          - name: SSH Python 3.12
            python-version: "3.12"
            extra: sshtunnel
            module: asyncssh
          - name: SSH Python 3.13
            python-version: "3.13"
            extra: sshtunnel
            module: asyncssh
          - name: QUIC and HTTP/3 Python 3.12
            python-version: "3.12"
            extra: quic
            module: aioquic
          - name: QUIC and HTTP/3 Python 3.13
            python-version: "3.13"
            extra: quic
            module: aioquic
          - name: Accelerated crypto and event loop Python 3.12
            python-version: "3.12"
            extra: accelerated
            module: Crypto
          - name: Accelerated crypto and event loop Python 3.13
            python-version: "3.13"
            extra: accelerated
            module: Crypto

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the selected optional extra
        run: python -m pip install -c constraints/optional.txt ".[${{ matrix.extra }}]"

      - name: Import the optional backend
        run: python -c "import importlib; importlib.import_module('${{ matrix.module }}')"

      - name: Run optional adapter contracts
        run: >-
          python -m unittest
          tests.test_optional_adapters
          tests.test_optional_runtime
          tests.test_phase1_integration
          -v

  latest-compatibility:
    name: Latest Python and allowed dependency ranges
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up latest Python 3.x
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip

      - name: Install latest dependencies within declared ranges
        run: >-
          python -m pip install
          --upgrade
          --upgrade-strategy eager
          -c constraints/optional.txt
          ".[accelerated,h2,sshtunnel,quic]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run latest compatibility contracts
        run: >-
          python -m unittest
          tests.test_optional_adapters
          tests.test_optional_runtime
          tests.test_phase1_integration
          -v
