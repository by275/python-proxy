name: Core checks

on:
  push:
    branches:
      - master
      - modernize
      - modernize-followup
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and development tools
        run: python -m pip install ".[dev]"

      - name: Compile source and tests
        run: python -m compileall -q pproxy tests

      - name: Smoke-test the installed CLI
        run: |
          python -m pproxy --version
          python -m pproxy -h

      - name: Run unittest contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run optimized unittest contracts
        run: python -O -m unittest discover -s tests -p "test_*.py" -v

      - name: Run pytest with coverage report
        run: python -m pytest -q --cov=pproxy --cov-report=term-missing

      - name: Lint source and tests for syntax and undefined names
        run: >-
          python -m ruff check
          pproxy tests
          --select E9,F821

      - name: Gate selected Pylint correctness messages
        run: >-
          python -m pylint
          --persistent=no
          --reports=no
          --score=no
          --disable=all
          --enable=E0102,W0640
          pproxy tests

      - name: Report Pylint production findings
        run: >-
          python -m pylint
          --persistent=no
          --reports=no
          --score=no
          --exit-zero
          pproxy

      - name: Report Pylint test and benchmark findings
        run: >-
          python -m pylint
          --persistent=no
          --reports=no
          --score=no
          --exit-zero
          --disable=duplicate-code,missing-class-docstring,missing-function-docstring,too-few-public-methods
          tests

      - name: Run proxy-level setup smoke benchmark
        run: python tests/benchmark_setup.py --connections 10

      - name: Build a wheel
        run: python -m build --wheel
